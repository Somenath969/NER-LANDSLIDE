<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.5" />

  <!-- Shield Shape (Disaster Resilience) -->
  <path d="M 256 64 L 400 128 C 400 288 256 424 256 448 C 256 424 112 288 112 128 Z" 
        fill="#1e293b" stroke="url(#shieldGrad)" stroke-width="12" stroke-linejoin="round" />

  <!-- Mountain Peak with Landslide Slip Failure Lines -->
  <polygon points="256,150 350,330 162,330" fill="url(#mountainGrad)" />
  <polygon points="256,150 210,330 162,330" fill="#b45309" />
  
  <!-- Landslide Shear Slip Arc / Radar Wave -->
  <path d="M 220 220 Q 280 250 340 310" fill="none" stroke="#fef08a" stroke-width="8" stroke-dasharray="8 6" stroke-linecap="round" />
  <path d="M 200 250 Q 250 280 300 330" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

  <!-- Radar Early Warning Wave Pulses -->
  <circle cx="256" cy="150" r="16" fill="#38bdf8" />
  <circle cx="256" cy="150" r="36" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.8" />
  <circle cx="256" cy="150" r="60" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.4" />

  <!-- Geotag GIS Pin Marker -->
  <g transform="translate(256, 365)">
    <circle cx="0" cy="0" r="14" fill="#ef4444" stroke="#ffffff" stroke-width="4" />
    <circle cx="0" cy="0" r="5" fill="#ffffff" />
  </g>
</svg>
